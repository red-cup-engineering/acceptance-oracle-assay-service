name: Acceptance evidence source admission

on:
  pull_request:
    paths:
      - src/assay.mjs
      - test/assay-source-admission.test.mjs
      - test/assay.test.mjs
      - scripts/server.mjs
      - scripts/execute-a2a-task.mjs
      - data/records/systemd/acceptance-oracle-assay-service.service
      - .github/workflows/acceptance-source-admission.yml
  push:
    paths:
      - src/assay.mjs
      - test/assay-source-admission.test.mjs
      - test/assay.test.mjs
      - scripts/server.mjs
      - scripts/execute-a2a-task.mjs
      - data/records/systemd/acceptance-oracle-assay-service.service
      - .github/workflows/acceptance-source-admission.yml

permissions:
  contents: read

jobs:
  native-source-admission:
    name: Node 22 source-integrity controls (no workspace deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run the original package syntax contract
        run: |
          npm run check
          node --check test/assay.test.mjs
          node --check test/assay-source-admission.test.mjs
      - name: Positive, adversarial, and refusal controls
        run: node --test test/assay-source-admission.test.mjs
